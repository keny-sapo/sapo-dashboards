<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bahia - Estado de obra por villa</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#f7f8fa;color:#222;font-size:13px}
  .header{background:#fff;border-bottom:1px solid #e0e0e0;padding:14px 20px;position:sticky;top:0;z-index:300;display:flex;align-items:center;gap:12px}
  .header h1{font-size:17px;font-weight:700;color:#1a1a1a}
  .header .sub{font-size:11px;color:#999;margin-top:1px}
  .metrics{display:flex;gap:10px;padding:14px 20px;background:#fff;border-bottom:1px solid #e0e0e0;flex-wrap:wrap}
  .metric{border:1px solid #e8e8e8;border-radius:8px;padding:10px 16px;min-width:118px;background:#fafafa}
  .metric .val{font-size:24px;font-weight:700}
  .metric .val.black{color:#1a1a1a}.metric .val.green{color:#2e7d32}.metric .val.orange{color:#e65100}
  .metric .lbl{font-size:11px;color:#888;margin-top:3px}
  .legend{display:flex;gap:20px;align-items:center;padding:10px 20px;background:#fff;border-bottom:1px solid #e0e0e0;flex-wrap:wrap}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#444}
  .legend-box{width:16px;height:16px;border-radius:3px;border:1px solid #ccc;display:flex;align-items:center;justify-content:center;font-size:10px}
  .table-wrap{overflow:auto;padding:16px 20px}
  table{border-collapse:separate;border-spacing:0;white-space:nowrap;font-size:12px}
  tr.hito-row th{background:#fff3e0;color:#bf360c;font-size:11px;font-weight:700;text-align:center;border:1px solid #ffe0b2;padding:5px 4px;position:sticky;top:0;z-index:120}
  tr.hito-row th.villa-col{background:#f5f5f5;color:#555;border-color:#ddd;left:0;z-index:200}
  tr.hito-row th.empty-col{background:#f5f5f5;border-color:#ddd}
  tr.work-row th{background:#f0f0f0;color:#444;font-size:10px;font-weight:600;border:1px solid #ddd;height:92px;vertical-align:bottom;padding-bottom:4px;text-align:center;position:sticky;top:30px;z-index:110}
  tr.work-row th.villa-col{text-align:left;padding-left:8px;left:0;z-index:200;background:#f0f0f0;vertical-align:middle;height:auto}
  tr.work-row th.rotated span{display:block;transform:rotate(-60deg);transform-origin:right bottom;width:90px;text-align:left;overflow:hidden;text-overflow:ellipsis}
  th.villa-col{position:sticky;min-width:62px}
  td.villa-name{font-size:12px;font-weight:600;color:#333;background:#fafafa;padding:0 10px;text-align:left;position:sticky;left:0;z-index:20;border-right:2px solid #ccc;border-bottom:1px solid #e0e0e0;min-width:62px;height:24px}
  td{height:24px;width:30px;text-align:center;border:1px solid #e0e0e0}
  td.cell-done{background:#c8e6c9}td.cell-prog{background:#ffe0b2}td.cell-empty{background:#fff}
  td.cell-nowork{background:#f5f5f5;border-color:#eee}
  .ck{color:#2e7d32;font-size:13px}.ci{color:#e65100;font-size:13px}
  tr.block-label td{background:#e3f2fd;color:#0d47a1;font-size:11px;font-weight:700;padding:3px 10px;border-bottom:1px solid #bbdefb;text-align:left}
  tr.total-row td{font-size:10px;font-weight:600;height:22px;border:1px solid #ddd}
  tr.total-row td.villa-name{background:#eee;color:#555;font-size:10px}
  tr.sep td{height:8px;background:#f0f0f0;border:none}
  .loading{text-align:center;padding:60px;color:#888;font-size:14px}
  .error{text-align:center;padding:40px;color:#c62828}
</style>
</head>
<body>

<div class="header">
  <div style="font-size:20px">&#127959;&#65039;</div>
  <div>
    <h1>Bahia &mdash; Estado de obra por villa</h1>
    <div class="sub" id="sub">Cargando&hellip;</div>
  </div>
</div>

<div class="metrics" id="metrics"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-box" style="background:#c8e6c9;border-color:#a5d6a7">&#10003;</div> Completado</div>
  <div class="legend-item"><div class="legend-box" style="background:#ffe0b2;border-color:#ffcc80">&#9675;</div> En progreso</div>
  <div class="legend-item"><div class="legend-box" style="background:#fff"></div> Pendiente</div>
  <div class="legend-item"><div class="legend-box" style="background:#f5f5f5;border-color:#eee"></div> Sin iniciar / N-A</div>
</div>

<div class="table-wrap" id="content"><div class="loading">Cargando datos&hellip;</div></div>

<script>
var SHEET_ID = '1PnEElhlIXJ9UDYntImJqc1shAlDkOLrwoGCfsiXwapo';
var CSV_URL  = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&gid=0';

function parseCSV(text) {
  return text.split('\n').map(function (line) {
    var cols = [], cur = '', inQ = false;
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (c === '"') inQ = !inQ;
      else if (c === ',' && !inQ) { cols.push(cur); cur = ''; }
      else cur += c;
    }
    cols.push(cur);
    return cols.map(function (s) { return s.replace(/^"|"$/g, '').trim(); });
  });
}

function load() {
  fetch(CSV_URL, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (t) { render(parseCSV(t)); })
    .catch(function (e) {
      document.getElementById('content').innerHTML =
        '<div class="error">Error cargando datos: ' + e.message + '</div>';
    });
}

function render(rows) {
  // --- Detectar la fila de trabajos: >=10 celdas con texto y ningun porcentaje ---
  var workIdx = -1;
  for (var i = 0; i < Math.min(rows.length, 8); i++) {
    var ne = rows[i].filter(function (c) { return c !== ''; });
    var hasPct = ne.some(function (c) { return c.indexOf('%') !== -1; });
    if (ne.length >= 10 && !hasPct) { workIdx = i; break; }
  }
  if (workIdx === -1) {
    document.getElementById('content').innerHTML =
      '<div class="error">No se pudo detectar la cabecera de trabajos en el Sheet.</div>';
    return;
  }

  var workRow = rows[workIdx];
  var hitoRow = workIdx > 0 ? rows[workIdx - 1] : [];

  // --- Bloque contiguo de cabeceras (evita coger la fecha de la col 0) ---
  var last = -1;
  for (var i = workRow.length - 1; i >= 0; i--) { if (workRow[i] !== '') { last = i; break; } }
  var WORK_START = last;
  while (WORK_START - 1 >= 0 && workRow[WORK_START - 1] !== '') WORK_START--;
  var VILLA_COL = WORK_START - 1;
  if (VILLA_COL < 0) VILLA_COL = 0;

  var works = [], hitos = [];
  for (var i = WORK_START; i <= last; i++) {
    works.push(workRow[i]);
    var h = '';
    for (var j = i; j >= WORK_START; j--) { if (hitoRow[j]) { h = hitoRow[j]; break; } }
    hitos.push(h);
  }

  var hitoGroups = [], cur = null;
  for (var i = 0; i < hitos.length; i++) {
    if (hitos[i] !== cur) { hitoGroups.push({ label: hitos[i], span: 1 }); cur = hitos[i]; }
    else hitoGroups[hitoGroups.length - 1].span++;
  }

  // --- Fecha de ultima actualizacion ---
  var fecha = '';
  for (var r = 0; r <= workIdx && !fecha; r++) {
    for (var k = 0; k < WORK_START; k++) {
      var m = (rows[r][k] || '').match(/\d{1,2}\/\d{1,2}\/\d{2,4}/);
      if (m) { fecha = m[0]; break; }
    }
  }

  // --- Filas de datos ---
  var blocks = [], blk = { villas: [], totalRow: null };
  for (var r = workIdx + 1; r < rows.length; r++) {
    var row = rows[r];
    var firstWork = row[WORK_START] || '';

    if (firstWork.indexOf('%') !== -1) {
      var totals = [];
      for (var i = WORK_START; i <= last; i++) totals.push(row[i] || '0%');
      blk.totalRow = totals;
      blocks.push(blk);
      blk = { villas: [], totalRow: null };
      continue;
    }

    var nombre = row[VILLA_COL] || '';
    if (!nombre) continue;
    if (/^cluster/i.test(nombre)) continue;

    var cells = [], hasAny = false;
    for (var i = WORK_START; i <= last; i++) {
      var v = (row[i] || '').toLowerCase();
      if (v === 'x' || v === 'o') hasAny = true;
      cells.push(v);
    }
    blk.villas.push({ name: nombre, cells: cells, hasAny: hasAny });
  }
  if (blk.villas.length) blocks.push(blk);

  // --- Metricas ---
  var all = [];
  blocks.forEach(function (b) { all = all.concat(b.villas); });

  var enObra = all.filter(function (v) { return v.hasAny; }).length;
  var acabadas = all.filter(function (v) {
    return v.hasAny && v.cells.every(function (c) { return c === 'x'; });
  }).length;

  var enProgreso = 0;
  for (var wi = 0; wi < works.length; wi++) {
    var any = false, todas = true;
    for (var vi = 0; vi < all.length; vi++) {
      if (!all[vi].hasAny) continue;
      var c = all[vi].cells[wi];
      if (c === 'x' || c === 'o') any = true; else todas = false;
    }
    if (any && !todas) enProgreso++;
  }

  var hechas = 0, posibles = 0;
  all.forEach(function (v) {
    if (!v.hasAny) return;
    posibles += works.length;
    hechas += v.cells.filter(function (c) { return c === 'x'; }).length;
  });
  var pct = posibles ? Math.round(hechas / posibles * 100) : 0;

  document.getElementById('sub').textContent = 'Ultima actualizacion: ' + (fecha || '-');
  document.getElementById('metrics').innerHTML =
      '<div class="metric"><div class="val black">'  + enObra     + '</div><div class="lbl">Villas en obra</div></div>'
    + '<div class="metric"><div class="val green">'  + acabadas   + '</div><div class="lbl">Villas 100% terminadas</div></div>'
    + '<div class="metric"><div class="val orange">' + enProgreso + '</div><div class="lbl">Partidas en progreso</div></div>'
    + '<div class="metric"><div class="val orange">' + pct + '%</div><div class="lbl">Avance global</div></div>';

  // --- Tabla ---
  var h = '<table><thead><tr class="hito-row"><th class="villa-col">Villa</th>';
  hitoGroups.forEach(function (g) {
    h += '<th colspan="' + g.span + '"' + (g.label ? '' : ' class="empty-col"') + '>' + (g.label || '') + '</th>';
  });
  h += '</tr><tr class="work-row"><th class="villa-col">Villa</th>';
  works.forEach(function (w) { h += '<th class="rotated"><span>' + w + '</span></th>'; });
  h += '</tr></thead><tbody>';

  var n = 0;
  blocks.forEach(function (b) {
    if (!b.villas.length) return;
    n++;
    h += '<tr class="block-label"><td colspan="' + (works.length + 1) + '">Bloque ' + n + '</td></tr>';
    b.villas.forEach(function (v) {
      h += '<tr><td class="villa-name">' + v.name + '</td>';
      v.cells.forEach(function (c) {
        if (!v.hasAny)      h += '<td class="cell-nowork"></td>';
        else if (c === 'x') h += '<td class="cell-done"><span class="ck">&#10003;</span></td>';
        else if (c === 'o') h += '<td class="cell-prog"><span class="ci">&#9675;</span></td>';
        else                h += '<td class="cell-empty"></td>';
      });
      h += '</tr>';
    });
    if (b.totalRow) {
      h += '<tr class="total-row"><td class="villa-name">% bloque</td>';
      b.totalRow.forEach(function (p) {
        var v = parseInt(p, 10) || 0;
        var bg = v === 100 ? '#c8e6c9' : v > 0 ? '#fff9c4' : '#fff';
        var fg = v === 100 ? '#1b5e20' : v > 0 ? '#827717' : '#bbb';
        h += '<td style="background:' + bg + ';color:' + fg + '">' + (v > 0 ? v + '%' : '') + '</td>';
      });
      h += '</tr>';
    }
    h += '<tr class="sep"><td colspan="' + (works.length + 1) + '"></td></tr>';
  });

  h += '</tbody></table>';
  document.getElementById('content').innerHTML = h;
}

load();
setInterval(load, 15 * 60 * 1000);
</script>
</body>
</html>
