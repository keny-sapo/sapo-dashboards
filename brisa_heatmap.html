<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brisa — Villa Status</title>
<style>
  :root{
    --done:#2e7d32; --done-bg:#c8e6c9;
    --progress:#e65100; --progress-bg:#ffe0b2;
    --pending-bg:#ffffff; --pending-border:#e0e0e0;
    --nodata-bg:#f0f0f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, Arial, sans-serif; background: #f5f5f5; color: #222; font-size: 13px; }
  .header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 200; }
  .header h1 { font-size: 16px; font-weight: 600; color: #1a1a1a; }
  .header .meta { font-size: 11px; color: #888; margin-top: 2px; }
  .metrics { display: flex; gap: 12px; padding: 14px 20px; background: #fff; border-bottom: 1px solid #e0e0e0; flex-wrap: wrap; }
  .metric { background: #f9f9f9; border: 1px solid #e8e8e8; border-radius: 6px; padding: 10px 16px; min-width: 100px; }
  .metric .val { font-size: 22px; font-weight: 600; color: #1a1a1a; }
  .metric .lbl { font-size: 11px; color: #888; margin-top: 2px; }
  .metric .val.green { color: var(--done); }
  .metric .val.amber { color: var(--progress); }
  .legend { display: flex; gap: 16px; align-items: center; padding: 10px 20px; background: #fff; border-bottom: 1px solid #e0e0e0; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #555; }
  .legend-dot { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #ddd; }
  .table-wrap { overflow: auto; padding: 16px 20px 60px; max-height: calc(100vh - 190px); }
  table { border-collapse: collapse; white-space: nowrap; }
  th, td { border: 1px solid #d5d5d5; }
  th { background: #f7f7f7; color: #444; font-size: 10px; font-weight: 600; padding: 4px 3px; text-align: center; position: sticky; top: 0; z-index: 50; height: 175px; vertical-align: bottom; }
  th.rotated { padding-bottom: 8px; }
  th.rotated:nth-child(even) { background: #efefef; }
  th.rotated span { display: inline-block; transform: rotate(-82deg); transform-origin: bottom left; white-space: nowrap; }
  th.villa-col { position: sticky; left: 0; top: 0; z-index: 60; background: #f0f0f0; min-width: 74px; height: auto; vertical-align: middle; border-right: 2px solid #ccc; }
  thead tr th:nth-child(2) { padding-left: 14px; }
  td.villa-name { position: sticky; left: 0; background: #fafafa; font-weight: 600; font-size: 11px; padding: 4px 8px; z-index: 40; border-right: 2px solid #ddd; }
  td.status { width: 30px; height: 26px; text-align: center; }
  td.done { background: var(--done-bg); }
  td.progress { background: var(--progress-bg); }
  td.pending { background: var(--pending-bg); }
  td.nodata { background: var(--nodata-bg); }
  tr.block-total td { font-size: 10px; font-weight: 700; color: #444; background: #f4f4f4 !important; }
  tr.block-total td.villa-name { background: #eee; }
  tr.block-sep td { border: none; background: transparent; height: 8px; }
  .block-badge { display:inline-block; background:#e3e8f0; color:#3b4a63; border-radius:4px; padding:1px 6px; font-size:10px; font-weight:700; margin-right:6px; }
  .err { padding: 20px; color: #b71c1c; font-size: 13px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🏗️ Brisa — Estado de obra por villa</h1>
    <div class="meta" id="updated">Cargando…</div>
  </div>
</div>

<div class="metrics" id="metrics"></div>

<div class="legend">
  <div class="legend-item"><span class="legend-dot" style="background:var(--done-bg);border-color:var(--done)"></span> Completado</div>
  <div class="legend-item"><span class="legend-dot" style="background:var(--progress-bg);border-color:var(--progress)"></span> En progreso</div>
  <div class="legend-item"><span class="legend-dot" style="background:var(--pending-bg)"></span> Pendiente</div>
  <div class="legend-item"><span class="legend-dot" style="background:var(--nodata-bg)"></span> Sin iniciar / N-A</div>
</div>

<div class="table-wrap" id="content">Cargando datos…</div>

<script>
// ---- CONFIG (cambiar solo esto para reutilizar en otro proyecto) ----
const SHEET_ID = '1E9oNuR6fi7k4DASYevG-B6W3-S0DKmLz';
const GID = '1094881952';
const PROJECT_NAME = 'Brisa';
// -----------------------------------------------------------------

const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`;

// Google's CSV export blanks the header text for some columns (observed on
// this sheet) while still exporting their data correctly. This is the true
// list of work names in order, used only to fill in blanks positionally —
// if the export already has a name for a column, that name wins.
const FALLBACK_WORKS = ['Bowplank','Excavation','Footplat + pedestal','Stone masonry','Tie beams','Concrete floors','Floor finishing','Stairs','Plant box','First floor columns','First floor beams','Second floor slab','Second floor columns','Second floor beams','Second floor roof','Walls','LSF truss','Roof cover','Drainage','Insulation','Interior ceilings','Bathroom walls','Bathroom waterproofing','Power lines','Light lines','Grounding','Panel','Fresh water pipes','Sewage pipes','Hot water pipes','LSF wardrobe','Kitchen set','Dining table','Bedframe + nakas','Plinth','Bathroom floor tiles','Shower','Toilet','Sink 1','Outlets + switches','Lights','Exterior paint','Interior paint','Pergola','Doors','Windows','AC 1','AC 2','TV','Fridge','Stove','Sink 2','Water dispenser','Bed','Wastafel table','TV shelf','Sofa','Stools','Rugs','Plants'];

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); field = ''; rows.push(row); row = []; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

async function loadData() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    render(rows);
  } catch (e) {
    document.getElementById('content').innerHTML =
      `<div class="err">No se pudo cargar el Google Sheet. Verifica que el archivo tenga permisos de lectura pública ("Cualquier persona con el enlace"). Detalle: ${e.message}</div>`;
  }
}

function isTextLike(c) {
  const t = (c || '').trim();
  if (t === '') return false;
  if (t.toLowerCase() === 'x' || t.toLowerCase() === 'o') return false;
  if (/^\d+%?$/.test(t)) return false;
  if (/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(t)) return false;
  return true;
}

function findHeaderRowIndex(rows) {
  // The real header row (work names) is whichever of the first few rows has the
  // most "text-like" cells — robust to title/date rows placed above it, which
  // vary in position depending on how the sheet was built.
  let bestIdx = 0, bestCount = -1;
  const scanLimit = Math.min(rows.length, 10);
  for (let i = 0; i < scanLimit; i++) {
    const count = rows[i].filter(isTextLike).length;
    if (count > bestCount) { bestCount = count; bestIdx = i; }
  }
  return bestIdx;
}

function render(rows) {
  const headerRowIdx = findHeaderRowIndex(rows);
  const headerRow = rows[headerRowIdx];

  // Look for a date anywhere in the rows above the header (title/last-update rows)
  let dateMatch = null;
  for (let i = 0; i <= headerRowIdx; i++) {
    const m = rows[i].find(c => /^\s*\d{1,2}\/\d{1,2}\/\d{2,4}\s*$/.test(c || ''));
    if (m) { dateMatch = m; break; }
  }
  document.getElementById('updated').textContent = dateMatch
    ? `Última actualización: ${dateMatch.trim()}`
    : '';

  // Work names start at the first text-like cell in the header row. IMPORTANT:
  // Google's CSV export sometimes blanks out header text for some columns
  // (seen on real data) while still keeping their data cells in position —
  // so we must NOT filter/compact blank header cells here, or the work
  // names would shift out of alignment with the data columns. Every column
  // from workStartCol to the end of the row is a work column, blank label or not.
  const workStartCol = headerRow.findIndex(c => isTextLike(c));
  const works = headerRow.slice(workStartCol).map((c, i) => {
    const t = (c || '').trim();
    return t !== '' ? t : (FALLBACK_WORKS[i] || '');
  });
  const nWorks = works.length;

  // Convention (consistent across projects): 2 identifier columns (block, villa)
  // immediately precede the work-status columns.
  const blockCol = workStartCol - 2;
  const villaCol = workStartCol - 1;

  // Parse remaining rows into villa rows / block-total rows
  const blocks = []; // { blockId, villas:[{name, cells:[status,...], hasAnyWork}], totalRow:[pct,...] }
  let currentBlock = null;

  for (let r = headerRowIdx + 1; r < rows.length; r++) {
    const row = rows[r];
    if (!row) continue;
    const blockCell = (row[blockCol] || '').trim();
    const villaCell = (row[villaCol] || '').trim();
    const rest = row.slice(workStartCol, workStartCol + nWorks);
    const isAllEmpty = rest.every(v => (v || '').trim() === '') && blockCell === '' && villaCell === '';
    if (isAllEmpty) continue;

    const isTotalRow = blockCell === '' && villaCell === '' && rest.some(v => /%/.test(v || ''));

    if (isTotalRow) {
      if (currentBlock) currentBlock.totalRow = rest;
      continue;
    }

    if (blockCell !== '') {
      if (!currentBlock || currentBlock.blockId !== blockCell) {
        currentBlock = { blockId: blockCell, villas: [], totalRow: null };
        blocks.push(currentBlock);
      }
      const cells = rest.map(v => (v || '').trim());
      const hasAnyWork = cells.some(v => v !== '');
      currentBlock.villas.push({ name: villaCell, cells, hasAnyWork });
    }
  }

  // ---- metrics ----
  let done = 0, progress = 0, pending = 0, total = 0;
  let villaCount = 0, villaFullyDone = 0;
  for (const b of blocks) {
    for (const v of b.villas) {
      if (!v.hasAnyWork) continue;
      villaCount++;
      let allDone = true;
      for (const cell of v.cells) {
        total++;
        if (cell === 'x') done++;
        else if (cell === 'o') progress++;
        else { pending++; allDone = false; }
        if (cell !== 'x') allDone = false;
      }
      if (allDone) villaFullyDone++;
    }
  }
  const globalPct = total ? Math.round((done / total) * 100) : 0;

  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="val">${villaCount}</div><div class="lbl">Villas en obra</div></div>
    <div class="metric"><div class="val green">${villaFullyDone}</div><div class="lbl">Villas 100% terminadas</div></div>
    <div class="metric"><div class="val amber">${progress}</div><div class="lbl">Partidas en progreso</div></div>
    <div class="metric"><div class="val ${globalPct >= 60 ? 'green' : 'amber'}">${globalPct}%</div><div class="lbl">Avance global</div></div>
  `;

  // ---- table ----
  let html = '<table><thead><tr>';
  html += '<th class="villa-col">Villa</th>';
  for (const w of works) html += `<th class="rotated"><span>${escapeHtml(w)}</span></th>`;
  html += '</tr></thead><tbody>';

  for (const block of blocks) {
    html += `<tr><td class="villa-name" colspan="${nWorks + 1}"><span class="block-badge">Bloque ${escapeHtml(block.blockId)}</span></td></tr>`;
    for (const villa of block.villas) {
      html += `<tr><td class="villa-name">${escapeHtml(villa.name)}</td>`;
      for (const cell of villa.cells) {
        let cls = 'pending', label = '';
        if (!villa.hasAnyWork) cls = 'nodata';
        else if (cell === 'x') { cls = 'done'; label = '✓'; }
        else if (cell === 'o') { cls = 'progress'; label = '●'; }
        html += `<td class="status ${cls}">${label}</td>`;
      }
      html += '</tr>';
    }
    if (block.totalRow) {
      html += `<tr class="block-total"><td class="villa-name">% bloque ${escapeHtml(block.blockId)}</td>`;
      for (let i = 0; i < nWorks; i++) {
        const raw = (block.totalRow[i] || '').replace('%', '').trim();
        const val = parseInt(raw) || 0;
        html += `<td>${val > 0 ? val + '%' : ''}</td>`;
      }
      html += '</tr>';
    }
    html += `<tr class="block-sep">${'<td></td>'.repeat(nWorks + 1)}</tr>`;
  }

  html += '</tbody></table>';
  document.getElementById('content').innerHTML = html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

loadData();
</script>
</body>
</html>
